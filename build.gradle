allprojects {
    version = "1.0.0-SNAPSHOT"
    group = "dev.u9g"

    repositories {
        maven {
            name = "wagyourtail releases"
            url = "https://maven.wagyourtail.xyz/releases"
        }
        maven {
            name = "legacyfabric"
            url = "https://maven.legacyfabric.net/"
        }
        maven {
            name = "fabric"
            url = "https://maven.fabricmc.net/"
        }
        maven {
            name = "minecraft"
            url = "https://libraries.minecraft.net/"
        }
        mavenCentral()
    }
}

// The shared Stonecutter sources are formatted here: the version projects only see
// generated copies, and import order is not enforced because version conditions sit
// between imports.
apply plugin: 'com.diffplug.spotless'

spotless {
    java {
        target 'yarn/src/**/*.java', 'mojmap/src/**/*.java'

        trimTrailingWhitespace()
        indentWithSpaces(4)
        endWithNewline()
    }
}
